<!doctype html>
<meta charset="utf-8">
<title>Тетрис</title>
<style>
  body{margin:0;background:#111;color:white;font:20px sans-serif;text-align:center}canvas{margin:20px;border:2px solid #555;background:#000}
</style>
<h2>Тетрис — <span id="score">0</span></h2>
<canvas id="game" width="240" height="400"></canvas>
<p>← → двигать · ↑ вращать · ↓ ускорить · Enter заново</p>
<script>
const c=game.getContext('2d'),W=12,H=20,S=20,colors=['','#0ff','#ff0','#a0f','#0f0','#f00','#00f','#f80'];
let a,p,x,y,n=0,over=false,last=0;
const shapes=[[[1,1,1,1]],[[2,2],[2,2]],[[0,3,0],[3,3,3]],[[0,4,4],[4,4,0]],[[5,5,0],[0,5,5]],[[6,0,0],[6,6,6]],[[0,0,7],[7,7,7]]];
function reset(){a=Array.from({length:H},()=>Array(W).fill(0));n=0;over=false;spawn()}
function spawn(){p=shapes[Math.random()*7|0].map(r=>[...r]);x=5;y=0;if(hit())over=true}
function hit(){return p.some((r,j)=>r.some((v,i)=>v&&(a[y+j]?.[x+i]??1)))}
function move(dx,dy){x+=dx;y+=dy;if(hit()){x-=dx;y-=dy;if(dy){p.forEach((r,j)=>r.forEach((v,i)=>v&&(a[y+j][x+i]=v)));a=a.filter(r=>{if(r.every(Boolean)){n+=10;return false}return true});while(a.length<H)a.unshift(Array(W).fill(0));spawn()}return false}return true}
function turn(){let q=p;p=p[0].map((_,i)=>p.map(r=>r[i]).reverse());if(hit())p=q}
function draw(){c.clearRect(0,0,240,400);[...a,...[]].forEach((r,j)=>r.forEach((v,i)=>box(v,i,j)));p.forEach((r,j)=>r.forEach((v,i)=>box(v,x+i,y+j)));score.textContent=n+(over?' — конец игры':'')}
function box(v,i,j){if(v){c.fillStyle=colors[v];c.fillRect(i*S,j*S,S-1,S-1)}}
onkeydown=e=>{if(e.key==='Enter')reset();if(over)return;if(e.key==='ArrowLeft')move(-1,0);if(e.key==='ArrowRight')move(1,0);if(e.key==='ArrowDown')move(0,1);if(e.key==='ArrowUp')turn();draw()};
function loop(t){if(!over&&t-last>500){move(0,1);last=t}draw();requestAnimationFrame(loop)}reset();loop();
</script>
